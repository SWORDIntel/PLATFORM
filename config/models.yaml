# SWORD Coder Model Registry
# Updated: 2025-11-23
# Quantization strategy based on 50GB RAM system

# Storage estimates
storage:
  fp32_total_gb: 1369
  int8_total_gb: 341
  int4_total_gb: 171
  target_quantization: "mixed"  # INT8 for <=13B, INT4 for >13B

models:
  # ============================================================
  # FAST INFERENCE (Edge/NPU tier)
  # ============================================================
  fast:
    deepseek-r1-1.5b:
      canonical: "deepseek-ai/deepseek-r1-distill-qwen-1.5b"
      params_b: 1.5
      fp32_gb: 6.0
      int8_gb: 1.5
      int4_gb: 0.75
      quantization: "int8"  # ← Selected
      device_pool: ["npu", "amx"]
      latency_target_ms: 100
      use_case: ["fast_response", "streaming", "simple_queries"]

    phi-3-mini:
      canonical: "microsoft/phi-3-mini-4k-instruct"
      params_b: 3.8
      fp32_gb: 15.2
      int8_gb: 3.8
      int4_gb: 1.9
      quantization: "int8"
      device_pool: ["amx", "igpu"]
      latency_target_ms: 200
      use_case: ["reasoning", "math", "compact"]

  # ============================================================
  # CODE MODELS
  # ============================================================
  code:
    deepseek-coder-6.7b:
      canonical: "deepseek-ai/deepseek-coder-6.7b-instruct"
      params_b: 6.7
      fp32_gb: 26.8
      int8_gb: 6.7
      int4_gb: 3.35
      quantization: "int8"
      device_pool: ["amx"]
      latency_target_ms: 500
      use_case: ["code_generation", "debugging", "refactoring"]

    qwen2.5-coder-7b:
      canonical: "Qwen/Qwen2.5-Coder-7B-Instruct"
      params_b: 7.0
      fp32_gb: 28.0
      int8_gb: 7.0
      int4_gb: 3.5
      quantization: "int8"
      device_pool: ["amx"]
      latency_target_ms: 500
      use_case: ["code_completion", "code_review"]

    codellama-70b:
      canonical: "codellama/CodeLlama-70b-Instruct-hf"
      params_b: 70.0
      fp32_gb: 280.0
      int8_gb: 70.0
      int4_gb: 35.0
      quantization: "int4"  # ← Must use INT4
      device_pool: ["amx"]
      latency_target_ms: 2000
      use_case: ["complex_code", "architecture", "large_refactors"]
      note: "Requires 35GB, fits tight in 31GB available"

  # ============================================================
  # GENERAL LLMs
  # ============================================================
  general:
    llama-3-8b:
      canonical: "meta-llama/Meta-Llama-3-8B-Instruct"
      params_b: 8.0
      fp32_gb: 32.0
      int8_gb: 8.0
      int4_gb: 4.0
      quantization: "int8"
      device_pool: ["amx"]
      latency_target_ms: 500
      use_case: ["general", "chat", "analysis"]

    llama-3-70b:
      canonical: "meta-llama/Meta-Llama-3-70B-Instruct"
      params_b: 70.0
      fp32_gb: 280.0
      int8_gb: 70.0
      int4_gb: 35.0
      quantization: "int4"
      device_pool: ["amx"]
      latency_target_ms: 3000
      use_case: ["complex_reasoning", "research", "strategic"]

  # ============================================================
  # UNCENSORED / HERETIC POOL
  # ============================================================
  heretic:
    wizardlm-uncensored-13b:
      canonical: "TheBloke/WizardLM-13B-Uncensored-GGUF"
      params_b: 13.0
      fp32_gb: 52.0
      int8_gb: 13.0
      int4_gb: 6.5
      quantization: "int8"
      device_pool: ["heretic_pool", "amx"]
      latency_target_ms: 800
      use_case: ["unrestricted", "creative", "security_research"]
      permissiveness: "max"

    wizardlm-codellama-34b:
      canonical: "TheBloke/WizardLM-Uncensored-CodeLlama-34B-GGUF"
      params_b: 34.0
      fp32_gb: 136.0
      int8_gb: 34.0
      int4_gb: 17.0
      quantization: "int4"
      device_pool: ["heretic_pool", "amx"]
      latency_target_ms: 1500
      use_case: ["unrestricted_code", "exploit_analysis", "ctf"]
      permissiveness: "max"

  # ============================================================
  # STRATEGIC (Layer 9)
  # ============================================================
  strategic:
    gpt-oss-120b:
      canonical: "custom/gpt-oss-120b"
      params_b: 120.0
      fp32_gb: 480.0
      int8_gb: 120.0
      int4_gb: 60.0
      quantization: "int4"
      device_pool: ["offload", "distributed"]
      latency_target_ms: 10000
      use_case: ["strategic_planning", "executive_synthesis"]
      note: "60GB INT4 - requires disk offload or skip"
      status: "optional"

  # ============================================================
  # MULTIMODAL
  # ============================================================
  multimodal:
    llava-v1.6-7b:
      canonical: "liuhaotian/llava-v1.6-mistral-7b"
      params_b: 7.0
      fp32_gb: 28.0
      int8_gb: 7.0
      int4_gb: 3.5
      quantization: "int8"
      device_pool: ["igpu", "amx"]
      latency_target_ms: 1000
      use_case: ["image_understanding", "visual_qa", "document_analysis"]

  # ============================================================
  # AUDIO (GNA tier)
  # ============================================================
  audio:
    whisper-tiny:
      canonical: "openai/whisper-tiny"
      params_b: 0.039
      fp32_gb: 0.156
      int8_gb: 0.039
      int4_gb: 0.02
      quantization: "int8"
      device_pool: ["gna", "npu"]
      latency_target_ms: 50
      use_case: ["speech_to_text", "transcription"]

    whisper-small:
      canonical: "openai/whisper-small"
      params_b: 0.244
      fp32_gb: 0.976
      int8_gb: 0.244
      int4_gb: 0.122
      quantization: "int8"
      device_pool: ["gna", "npu"]
      latency_target_ms: 100
      use_case: ["accurate_transcription", "multilingual"]

  # ============================================================
  # VISION (Edge/Movidius tier)
  # ============================================================
  vision:
    yolov8n:
      canonical: "ultralytics/yolov8n"
      params_b: 0.0032
      fp32_gb: 0.013
      int8_gb: 0.0032
      int4_gb: 0.0016
      quantization: "int8"
      device_pool: ["movidius", "hailo", "npu"]
      latency_target_ms: 10
      use_case: ["object_detection", "realtime_tracking"]

    yolov8s:
      canonical: "ultralytics/yolov8s"
      params_b: 0.011
      fp32_gb: 0.044
      int8_gb: 0.011
      int4_gb: 0.0055
      quantization: "int8"
      device_pool: ["movidius", "hailo", "npu"]
      latency_target_ms: 20
      use_case: ["accurate_detection", "surveillance"]

  # ============================================================
  # EMBEDDINGS
  # ============================================================
  embeddings:
    bge-large-en-v1.5:
      canonical: "BAAI/bge-large-en-v1.5"
      params_b: 0.335
      fp32_gb: 1.34
      int8_gb: 0.335
      int4_gb: 0.168
      quantization: "int8"
      device_pool: ["npu", "amx"]
      latency_target_ms: 20
      use_case: ["semantic_search", "rag", "similarity"]

    jina-embeddings-v3:
      canonical: "jinaai/jina-embeddings-v3"
      params_b: 0.570
      fp32_gb: 2.28
      int8_gb: 0.57
      int4_gb: 0.285
      quantization: "int8"
      device_pool: ["npu", "amx"]
      latency_target_ms: 30
      use_case: ["multilingual_embeddings", "code_search"]

# Device pools
device_pools:
  npu_only:
    devices: ["npu"]
    max_model_mb: 500
    latency_ms: 10

  gna_audio:
    devices: ["gna"]
    max_model_mb: 300
    latency_ms: 50

  edge_vision:
    devices: ["movidius", "hailo", "npu"]
    max_model_mb: 200
    latency_ms: 15

  igpu_vision:
    devices: ["igpu"]
    max_model_gb: 4
    latency_ms: 50

  amx_llm:
    devices: ["amx"]
    max_model_gb: 31
    latency_ms: 500

  heretic_pool:
    devices: ["amx"]
    max_model_gb: 31
    permissiveness: "max"
    filters_disabled: true

  secure_pool:
    devices: ["mil_npu", "npu"]
    max_model_mb: 300
    classification: "SECRET"
