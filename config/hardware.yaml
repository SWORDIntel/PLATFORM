# SWORD Coder Hardware Configuration
# Updated: 2025-11-23
# Asset: JRTC1-5450-MILSPEC

system:
  total_ram_gb: 50
  os_reserved_gb: 10
  available_for_ai_gb: 31

accelerators:
  # Intel Core Ultra 7 165H SoC
  npu:
    name: "Intel NPU 3720"
    tops: 30
    power_w: 6.5
    latency_ms: 10
    max_params_m: 500
    quantization: ["int8", "int4"]
    memory_reserved_gb: 3
    best_for: ["realtime", "edge", "classification"]

  igpu:
    name: "Intel Arc 8 Xe-cores"
    tops: 40
    power_w: 20
    latency_ms: 30
    max_params_m: 500
    quantization: ["int8", "fp16", "fp32"]
    memory_reserved_gb: 6
    memory_type: "shared"
    best_for: ["vision", "cnn", "multimodal"]

  amx:
    name: "CPU AMX (6P+8E cores)"
    tops: 32
    power_w: 28
    latency_ms: 100
    max_params_b: 7
    quantization: ["int8", "bf16"]
    memory_type: "full_system"
    best_for: ["transformers", "llm", "batch"]

  avx512:
    name: "AVX-512 VNNI"
    tops: 10
    power_w: 15
    latency_ms: 50
    quantization: ["fp32", "int8"]
    best_for: ["preprocessing", "classical_ml", "postprocessing"]

  # M.2 Edge Accelerators (3× Movidius now)
  movidius:
    count: 3  # Updated from 2
    name: "Intel Movidius MA2x8x VPU"
    tops_each: 4
    tops_total: 12  # 3 × 4 TOPS
    power_w_each: 2.5
    memory_mb_each: 512
    memory_total_mb: 1536  # 3 × 512 MB dedicated
    latency_ms: 5
    max_params_m: 100
    quantization: ["int8", "fp16"]
    form_factor: "M.2 2280"
    slots: ["M.2-2", "M.2-3", "M.2-5"]  # Added 3rd slot
    best_for: ["edge_vision", "tactical", "low_power", "parallel_inference"]

  hailo:
    name: "Hailo-8 MCM"
    tops: 26
    power_w: 2.5
    memory_mb: 1024
    latency_ms: 8
    max_params_m: 200
    quantization: ["int8", "int4"]
    form_factor: "M.2 2230"
    slot: "M.2-4"
    best_for: ["edge_ai", "object_detection", "classification"]

  # Military-grade NPU (hardened)
  mil_npu:
    name: "MIL-NPU (TEMPEST-compliant)"
    tops: 25
    power_w: 8
    latency_ms: 8
    max_params_m: 300
    quantization: ["int8"]
    best_for: ["tactical", "sigint", "secure_inference"]

# Compute totals
compute_summary:
  soc_tops: 112        # NPU(30) + iGPU(40) + AMX(32) + AVX512(10)
  edge_tops: 38        # 3×Movidius(12) + Hailo(26)
  total_tops: 150      # Without discrete GPU
  with_flex_140: 283   # If FLEX 140 added (+133 TOPS)

# Memory allocation strategy
memory_strategy:
  # Models that fit in edge accelerators (dedicated memory)
  edge_tier:
    max_size_mb: 500
    devices: ["movidius", "hailo", "npu"]
    models: ["yolov8n", "yolov8s", "mobilenet", "efficientnet", "whisper-tiny"]

  # Models using shared system RAM
  system_tier:
    max_size_gb: 8
    devices: ["igpu", "amx"]
    models: ["phi-3-mini", "deepseek-r1:1.5b", "deepseek-coder:6.7b", "llama-3-8b"]

  # Large models requiring INT4 quantization
  large_tier:
    max_size_gb: 35
    devices: ["amx"]
    quantization: "int4"
    models: ["wizardlm-codellama:34b", "codellama:70b", "llama-3-70b"]

  # Models too large for single node
  offload_tier:
    min_size_gb: 60
    strategy: "disk_offload_or_skip"
    models: ["gpt-oss-120b"]

# Quantization strategy
quantization_plan:
  int8_models:
    - "deepseek-r1:1.5b"
    - "phi-3-mini:3.8b"
    - "deepseek-coder:6.7b"
    - "qwen2.5-coder:7b"
    - "llama-3-8b"
    - "llava-v1.6-7b"
    - "wizardlm-uncensored:13b"
    - "whisper-tiny"
    - "whisper-small"
    - "yolov8n"
    - "yolov8s"
    - "bge-large-en-v1.5"
    - "jina-embeddings-v3"

  int4_models:
    - "wizardlm-uncensored-codellama:34b"
    - "codellama:70b"
    - "llama-3-70b"
    - "gpt-oss-120b"

# Edge device distribution (3× Movidius)
edge_distribution:
  movidius_1:
    slot: "M.2-2"
    layer: "3A"
    devices: [15, 16, 17, 18]
    workload: "vision_preprocessing"
  movidius_2:
    slot: "M.2-3"
    layer: "3B"
    devices: [19, 20, 21, 22]
    workload: "tactical_inference"
  movidius_3:
    slot: "M.2-5"
    layer: "3C"
    devices: [63, 64, 65, 66]  # New device IDs
    workload: "parallel_classification"
  hailo_8:
    slot: "M.2-4"
    layer: "4"
    devices: [23, 24, 25, 26]
    workload: "object_detection"
